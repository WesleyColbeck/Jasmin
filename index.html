<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliz Aniversário ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            overflow: hidden;
        }

        /* TELA DE ANIVERSÁRIO */
        .tela {
            display: none;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 25px;
        }

        .tela.ativa {
            display: flex;
        }

        #tela1 {
            background:
                radial-gradient(
                    circle at center,
                    #fff5fa 0%,
                    #ffe8f2 45%,
                    #fbd5e5 100%
                );
            color: #a63e69;
        }

        .conteudo {
            position: relative;
            z-index: 2;
            animation: aparecer 1.5s ease;
        }

        .decoracao {
            font-size: 34px;
            margin-bottom: 20px;
            animation: pulsar 2s infinite ease-in-out;
        }

        h1 {
            font-size: clamp(35px, 9vw, 58px);
            font-weight: normal;
            line-height: 1.2;
            margin-bottom: 18px;
            text-shadow: 0 3px 15px #e8a5c333;
        }

        .subtitulo {
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: #bd688b;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .botao {
            border: none;
            border-radius: 50px;
            padding: 16px 34px;
            background: linear-gradient(
                135deg,
                #e989b3,
                #d85c92
            );
            color: white;
            font-size: 17px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 22px #d85c9240;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            -webkit-tap-highlight-color: transparent;
        }

        .botao:active {
            transform: scale(0.95);
        }

        /* CORAÇÕES CAINDO */
        .coracao {
            position: absolute;
            top: -50px;
            color: #e77ba7;
            opacity: 0.65;
            pointer-events: none;
            user-select: none;
            animation: cair linear forwards;
        }

        @keyframes cair {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(115vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulsar {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        /* SEGUNDA TELA PROVISÓRIA */
        #tela2 {
            background: #fff0f6;
            color: #a63e69;
        }

        #tela2 h2 {
            font-size: 30px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        #tela2 p {
            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <!-- PRIMEIRA TELA -->
    <section id="tela1" class="tela ativa">

        <div class="conteudo">

            <div class="decoracao">♡</div>

            <h1>Feliz<br>Aniversário!</h1>

            <p class="subtitulo">
                Um presente feito com carinho para você
            </p>

            <button class="botao" onclick="irParaProximaTela()">
                Ver Presente ❤️
            </button>

        </div>

    </section>

    <!-- SEGUNDA TELA PROVISÓRIA -->
    <section id="tela2" class="tela">

        <div class="conteudo">

            <div class="decoracao">💗</div>

            <h2>Seu presente continua...</h2>

            <p>
                Estamos preparando algo especial para você.
                <br>
                A próxima etapa será o nosso jogo da velha!
            </p>

            <button class="botao" onclick="voltarInicio()">
                Voltar ao início
            </button>

        </div>

    </section>

    <script>
        // NAVEGAÇÃO ENTRE AS TELAS
        function irParaProximaTela() {
            document.getElementById("tela1").classList.remove("ativa");
            document.getElementById("tela2").classList.add("ativa");
        }

        function voltarInicio() {
            document.getElementById("tela2").classList.remove("ativa");
            document.getElementById("tela1").classList.add("ativa");
        }

        // CRIAÇÃO DOS CORAÇÕES CAINDO
        function criarCoracao() {
            const tela = document.getElementById("tela1");

            const coracao = document.createElement("span");

            coracao.classList.add("coracao");

            const simbolos = ["♡", "♥", "❤"];
            coracao.textContent =
                simbolos[Math.floor(Math.random() * simbolos.length)];

            coracao.style.left = Math.random() * 100 + "%";

            const tamanho = Math.random() * 18 + 12;
            coracao.style.fontSize = tamanho + "px";

            const duracao = Math.random() * 5 + 7;
            coracao.style.animationDuration = duracao + "s";

            tela.appendChild(coracao);

            setTimeout(() => {
                coracao.remove();
            }, duracao * 1000);
        }

        // GERA NOVOS CORAÇÕES A CADA 450 MILISSEGUNDOS
        setInterval(criarCoracao, 450);
    </script>

</body>
</html>
